name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable && rustup default stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Build the icon
        run: target/release/g25app icon --out genesloppa.icns
