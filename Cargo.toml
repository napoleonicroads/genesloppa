[package]
name = "g25app"
version = "0.1.0"
edition = "2021"
description = "Raw DNA -> Global25 converter (std-only, ships with its reference data)"
license = "MIT"
repository = "https://github.com/napoleonicroads/genesloppa"
readme = "README.md"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# type-check the macOS GUI module on other platforms (`cargo check --features check-gui`)
check-gui = []
# render pages to PNG from environment variables (see src/gui/shots.rs)
shots = []
